<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RepoAtlas</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="side-rail" aria-label="Repository filters and scan controls">
        <div class="brand-block">
          <img class="brand-logo" src="/logo.svg" alt="" aria-hidden="true" />
          <div>
            <p class="eyebrow">Context map</p>
            <h1>RepoAtlas</h1>
          </div>
        </div>

        <label class="search-box">
          <span>Search</span>
          <input id="searchInput" type="search" placeholder="Repository, language, path" autocomplete="off" />
        </label>

        <label class="account-box">
          <span>GitHub accounts</span>
          <textarea id="accountsInput" rows="3" spellcheck="false" placeholder="Leave empty for current gh login&#10;Harzva&#10;saihao"></textarea>
        </label>

        <section class="control-group" aria-label="Status filter">
          <p class="control-title">Status</p>
          <div id="statusFilters" class="segmented">
            <button class="active" type="button" data-status="all">All</button>
            <button type="button" data-status="local">Local</button>
            <button type="button" data-status="diverged">Diverged</button>
            <button type="button" data-status="behind">Behind</button>
            <button type="button" data-status="dirty">Dirty</button>
            <button type="button" data-status="no-local-copy">Missing</button>
          </div>
        </section>

        <section class="control-group" aria-label="Category filter">
          <p class="control-title">Category</p>
          <div id="categoryFilters" class="segmented category-grid">
            <button class="active" type="button" data-category="all">All</button>
            <button type="button" data-category="skills">Skills</button>
            <button type="button" data-category="mcp">MCP</button>
            <button type="button" data-category="memory">Memory</button>
            <button type="button" data-category="software">Software</button>
            <button type="button" data-category="docs">Docs</button>
            <button type="button" data-category="infra">Infra</button>
            <button type="button" data-category="research">Research</button>
            <button type="button" data-category="data">Data</button>
            <button type="button" data-category="games">Games</button>
            <button type="button" data-category="other">Other</button>
          </div>
        </section>

        <section class="control-group" aria-label="Visibility filter">
          <p class="control-title">Visibility</p>
          <div id="visibilityFilters" class="segmented two">
            <button class="active" type="button" data-visibility="all">All</button>
            <button type="button" data-visibility="public">Public</button>
            <button type="button" data-visibility="private">Private</button>
          </div>
        </section>

        <section class="control-group" aria-label="Source filter">
          <p class="control-title">Source</p>
          <div id="forkFilters" class="segmented two">
            <button class="active" type="button" data-fork="all">All</button>
            <button type="button" data-fork="source">Source</button>
            <button type="button" data-fork="fork">Fork</button>
          </div>
        </section>

        <section class="control-group" aria-label="Theme">
          <p class="control-title">Theme</p>
          <div id="themeButtons" class="theme-palette">
            <button class="active" type="button" data-theme="atlas" title="Atlas theme"><span style="--swatch: #0b7f77"></span>Atlas</button>
            <button type="button" data-theme="midnight" title="Midnight theme"><span style="--swatch: #d7ff6b"></span>Midnight</button>
            <button type="button" data-theme="paper" title="Paper theme"><span style="--swatch: #c24b32"></span>Paper</button>
            <button type="button" data-theme="aurora" title="Aurora theme"><span style="--swatch: #7a5cff"></span>Aurora</button>
          </div>
        </section>

        <label class="select-box">
          <span>Sort</span>
          <select id="sortSelect">
            <option value="pushed-desc">Last pushed</option>
            <option value="name-asc">Name A-Z</option>
            <option value="status-asc">Status</option>
            <option value="language-asc">Language</option>
          </select>
        </label>

        <section class="control-group scan-controls" aria-label="Scan options">
          <p class="control-title">Scan</p>
          <label class="scan-box">
            <span>Roots</span>
            <textarea id="scanRootsInput" rows="4" spellcheck="false" placeholder="C:\Users\you\Projects"></textarea>
          </label>
          <div class="scan-row">
            <label class="toggle-row">
              <input id="fetchToggle" type="checkbox" checked />
              <span>Fetch remotes</span>
            </label>
            <label class="depth-box">
              <span>Depth</span>
              <input id="maxDepthInput" type="number" min="1" max="30" step="1" value="10" />
            </label>
          </div>
        </section>

        <nav class="report-links" aria-label="Reports">
          <a href="/reports/repo-atlas.json" target="_blank" rel="noreferrer">JSON</a>
          <a href="/reports/repo-atlas-full.csv" target="_blank" rel="noreferrer">CSV</a>
          <a href="/reports/repo-atlas-full.md" target="_blank" rel="noreferrer">MD</a>
        </nav>
      </aside>

      <main class="workspace">
        <header class="top-bar">
          <div class="title-stack">
            <p id="generatedAt" class="eyebrow">Inventory</p>
            <h2>Repository Context Atlas</h2>
            <div id="accountChips" class="account-chips" aria-label="Scanned accounts"></div>
          </div>
          <div class="top-actions">
            <button id="refreshButton" class="refresh-button" type="button" title="Refresh inventory">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M20 6v5h-5l1.9-1.9A6.5 6.5 0 0 0 5.8 12H3.7A8.5 8.5 0 0 1 18.3 7.7L20 6Zm-1.8 6A6.5 6.5 0 0 1 7.1 16.9L5.2 18.8H10v2H2v-8h2v4.6l1.7-1.7A8.5 8.5 0 0 0 20.3 12h-2.1Z"
                />
              </svg>
              <span>Refresh</span>
            </button>
          </div>
        </header>

        <div id="errorBanner" class="error-banner" hidden></div>

        <section id="metricsGrid" class="metrics-grid" aria-label="Inventory metrics"></section>

        <section class="matched-strip" aria-labelledby="matchedHeading">
          <div class="section-heading compact">
            <h3 id="matchedHeading">Local matches</h3>
            <span id="matchedCount" class="counter-pill">0</span>
          </div>
          <div id="matchedList" class="matched-list"></div>
        </section>

        <div class="content-grid">
          <section class="repo-panel" aria-labelledby="repoHeading">
            <div class="section-heading compact">
              <h3 id="repoHeading">Remote repositories</h3>
              <span id="resultCount" class="counter-pill">0</span>
            </div>
            <div id="repoTable" class="repo-table" role="table" aria-label="Remote repositories"></div>
          </section>

          <aside id="detailPanel" class="detail-panel" aria-label="Repository details">
            <div class="detail-empty">Choose a repository</div>
          </aside>
        </div>

        <section class="local-only-panel" aria-labelledby="localOnlyHeading">
          <div class="section-heading compact">
            <h3 id="localOnlyHeading">Local-only Git folders</h3>
            <span id="localOnlyCount" class="counter-pill">0</span>
          </div>
          <div id="localOnlyList" class="local-list"></div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="/app.js" defer></script>
  </body>
</html>
