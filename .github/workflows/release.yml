name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    name: Windows portable exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -eq "main" -or $version -eq "refs/heads/main") { $version = "manual" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/repo-atlas.exe "release/RepoAtlas-$version-windows-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoAtlas-Windows-x64
          path: release/*.exe

  macos:
    name: macOS portable app
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cargo-release-
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      - name: Build release
        run: cargo build --release

      - name: Prepare artifact
        shell: bash
        run: |
          version="${GITHUB_REF_NAME:-manual}"
          if [[ "$version" == "main" || "$version" == "refs/heads/main" ]]; then version="manual"; fi
          mkdir -p release/package
          cp target/release/repo-atlas release/package/RepoAtlas
          chmod +x release/package/RepoAtlas
          cat > release/package/README.txt <<'EOF'
          Run ./RepoAtlas from Terminal. Live rescans require Git and GitHub CLI.
          EOF
          tar -czf "release/RepoAtlas-${version}-macos-${RUNNER_ARCH}.tar.gz" -C release/package .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: RepoAtlas-macOS-${{ runner.arch }}
          path: release/*.tar.gz

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - windows
      - macos
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/**/*
          body_path: RELEASE_NOTES.md
