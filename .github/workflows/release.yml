name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows portable exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare artifact
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if (-not $version -or $version -eq "refs/heads/main") { $version = "manual" }
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/harzva-repo-atlas.exe "release/Harzva-Repo-Atlas-$version-x64.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Harzva-Repo-Atlas-Windows-x64
          path: release/*.exe

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.exe
          body_path: RELEASE_NOTES.md
